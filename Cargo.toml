[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/krondor-corp/confit"
description = "Generic config resolver with interpolation and provider evaluation"

[workspace.dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
fd-lock = "4"
regex = "1"
base64 = "0.22"
tempfile = "3"
serial_test = "3"
ssh-key = { version = "0.6", features = ["std", "ed25519"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

thiserror = "2"
anyhow = "1"

clap = { version = "4", features = ["derive", "env"] }
colored = "3"

confit-core = { path = "crates/confit-core" }
confit-cli = { path = "crates/confit-cli" }
